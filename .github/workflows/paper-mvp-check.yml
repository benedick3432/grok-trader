name: Paper analyst checks

on:
  push:
    branches: [termux-paper-mvp]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile bot.py analysis.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Import bot without starting scanner
        run: python -c "import bot; print('IMPORT_OK')"
